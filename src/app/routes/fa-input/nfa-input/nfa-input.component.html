<nz-card>
  <nz-space style="width: 100%">
    <nz-input-number
      [ngModel]="statesSize$ | async"
      [nzStep]="1"
      [nzMin]="1"
      (ngModelChange)="statesSize$.next($event)"
    >
      <span nzInputAddonBefore>总状态数</span>
    </nz-input-number>

    <nz-input-number
      [ngModel]="terminalsSize$ | async"
      [nzStep]="1"
      (ngModelChange)="terminalsSize$.next($event)"
      [nzMin]="1"
    >
      <span nzInputAddonBefore>终结符数</span>
    </nz-input-number>
  </nz-space>

  @if (tableInputs$ | async; as nfaTableInput) {
    <nz-table [nzData]="[{}]" [nzShowPagination]="false">
      <thead>
        <tr>
          <th rowspan="2" nzLeft>状态</th>
          <th rowspan="2">开始状态</th>
          <th rowspan="2">终止状态</th>
          <th [colspan]="terminalsSize$ | async">输入字符</th>
        </tr>
        <tr>
          @for (terminalInput$ of nfaTableInput.terminals; track $index) {
            <th rowSpan="1">
              <input
                type="text"
                nz-input
                [ngModel]="terminalInput$ | async"
                (ngModelChange)="terminalInput$.next($event)"
              />
            </th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of nfaTableInput.rows; track $index) {
          <tr></tr>
          <td nzLeft>{{ row.stateId$ | async }}</td>
          <td>
            <label
              nz-radio
              [ngModel]="row.isS$ | async"
              (ngModelChange)="nfaTableInput.s$.next($index)"
            ></label>
          </td>
          <td>
            <label
              nz-checkbox
              [ngModel]="row.isF$ | async"
              (ngModelChange)="row.isF$.next($event)"
            ></label>
          </td>

          @for (transTableInput$ of row.transTable; track $index) {
            <td>
              <app-states-input
                [states]="(transTableInput$ | async)!"
                [maxId]="(statesSize$ | async)!"
                (statesChange)="transTableInput$.next($event)"
              ></app-states-input>
            </td>
          }
        }
      </tbody>
    </nz-table>
  }
</nz-card>
